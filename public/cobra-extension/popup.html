<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 280px; background: #0d0d12; color: #e2e2e2; font-family: -apple-system, sans-serif; padding: 16px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .header h1 { font-size: 18px; color: #a78bfa; font-weight: 700; }
    .header .version { font-size: 11px; color: #666; }
    .status { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
    .status.connected { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }
    .status.disconnected { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.on { background: #22c55e; }
    .dot.off { background: #ef4444; }
    .info { font-size: 12px; color: #999; line-height: 1.5; }
    .info a { color: #a78bfa; text-decoration: none; }
    .btn { display: block; width: 100%; padding: 8px; margin-top: 10px; background: #a78bfa; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #8b6fd4; }
  </style>
</head>
<body>
  <div class="header">
    <h1>COBRA Bridge</h1>
    <span class="version" id="extVersion"></span>
  </div>
  <div class="status" id="status">
    <div class="dot" id="dot"></div>
    <span id="statusText">Verifica connessione...</span>
  </div>
  <p class="info">
    Questa estensione collega il tuo browser a <a href="http://localhost:3000" target="_blank">COBRA Web App</a>.<br><br>
    COBRA può navigare, leggere pagine, compilare form e interagire con i siti nel tuo browser reale.
  </p>
  <button class="btn" id="openCobra">Apri COBRA</button>
  <script src="popup.js"></script>
</body>
</html>
